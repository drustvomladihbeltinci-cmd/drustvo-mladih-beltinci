<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Urejevalnik – Društvo mladih Beltinci</title>
  <link rel="icon" type="image/svg+xml" href="/assets/grb.svg">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <!-- Prijava -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="form login-box">
      <img src="/assets/grb.svg" alt="Grb DMB" width="110" height="110">
      <h1>Prijava za vodje projektov</h1>
      <label>Uporabniško ime<input name="username" autocomplete="username" required></label>
      <label>Geslo<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-yellow" type="submit">Prijava</button>
      <p class="form-msg err" id="login-msg"></p>
      <a href="/" class="back">← Nazaj na spletno stran</a>
    </form>
  </section>

  <!-- Urejevalnik -->
  <section id="app-view" hidden>
    <header class="topbar">
      <a class="brand" href="/" target="_blank"><img src="/assets/grb.svg" alt="" width="40" height="40"><span>DMB urejevalnik</span></a>
      <div class="who"><span id="who"></span><button class="btn-link" id="logout">Odjava</button></div>
    </header>
    <div class="wrap admin-wrap">
      <div class="tabs" id="tabs"></div>
      <div class="notice" id="notice" hidden></div>
      <div id="panel"></div>
    </div>
  </section>

  <script src="/admin/admin.js"></script>
</body>
</html>
