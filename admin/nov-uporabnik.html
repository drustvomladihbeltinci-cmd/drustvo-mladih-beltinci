<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Ustvari uporabnika – DMB</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
<div class="wrap admin-wrap" style="max-width:820px">
  <h2>Ustvari uporabnike</h2>
  <p>Vpiši uporabnike in gesla. Gesla se tukaj <strong>šifrirajo v tvojem brskalniku</strong> – nikamor se ne pošiljajo.
  Na koncu kopiraj zeleno polje in ga prilepi v Cloudflare kot spremenljivko <code>USERS</code>.</p>
  <form class="form" id="f">
    <div id="rows"></div>
    <div class="form-actions">
      <button type="button" class="sbtn" id="more">+ Dodaj uporabnika</button>
      <button type="submit" class="btn btn-yellow">Ustvari vrednost USERS</button>
    </div>
    <div class="row" style="margin-top:1.2rem"><label>Vrednost za USERS <span class="hint">– kopiraj v Cloudflare</span>
      <textarea id="out" rows="8" readonly style="background:#E6F4EA;font-family:monospace;font-size:.85rem"></textarea></label></div>
  </form>
</div>
<script>
const rows = document.getElementById("rows");
function addRow(role) {
  const d = document.createElement("div");
  d.className = "vrednota";
  d.innerHTML = `<div class="row two"><label>Uporabniško ime<input class="u" placeholder="npr. janez"></label>
    <label>Ime in priimek<input class="n" placeholder="npr. Janez Novak"></label></div>
    <div class="row two"><label>Geslo<input class="p" type="text" placeholder="vsaj 8 znakov"></label>
    <label>Vloga<select class="r"><option value="vodja">vodja projekta</option><option value="admin">administrator</option></select></label></div>`;
  if (role) d.querySelector(".r").value = role;
  rows.appendChild(d);
}
addRow("admin"); addRow();
document.getElementById("more").onclick = () => addRow();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const users = {};
  for (const d of rows.children) {
    const u = d.querySelector(".u").value.trim().toLowerCase(), p = d.querySelector(".p").value;
    if (!u) continue;
    if (p.length < 8) { alert(`Geslo za »${u}« mora imeti vsaj 8 znakov.`); return; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, key, 256);
    users[u] = { name: d.querySelector(".n").value.trim() || u, role: d.querySelector(".r").value, salt: hex(salt), hash: hex(bits) };
  }
  document.getElementById("out").value = JSON.stringify(users);
};
</script>
</body>
</html>
